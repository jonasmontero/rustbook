<!-- AnalyticsPage - Analytics Dashboard with 5 Charts -->
<template-dashboard-layout [activeRoute]="'/analytics'">

  <div class="page-analytics">
    <!-- Chart 1: Line Chart - Reservation History (Full Width) -->
    <div class="page-analytics__chart page-analytics__chart--full">
      <organism-price-chart
        [data]="reservationHistory"
        [period]="'90d'"
      />
    </div>

    <!-- Charts 2 & 3: Pie Chart + Column Chart (Side by Side) -->
    <div class="page-analytics__chart page-analytics__chart--half">
      <organism-pie-chart
        [title]="'Flight Distribution by Airline'"
        [data]="distributionData"
        [showPercentages]="true"
      />
    </div>

    <div class="page-analytics__chart page-analytics__chart--half">
      <organism-column-chart
        [title]="'Flights per Month'"
        [data]="monthlyFlightsData"
      />
    </div>

    <!-- Chart 4: Bar Chart - Top 10 Routes (Full Width) -->
    <div class="page-analytics__chart page-analytics__chart--full">
      <organism-bar-chart
        [title]="'Top 10 Most Booked Routes'"
        [data]="topRoutesData"
      />
    </div>

    <!-- Chart 5: Area Chart - Monthly Cumulative Revenue (Full Width) -->
    <div class="page-analytics__chart page-analytics__chart--full">
      <organism-area-chart
        [title]="'Monthly Cumulative Revenue'"
        [data]="cumulativeRevenueData"
        [fillColor]="'#10B981'"
      />
    </div>
  </div>

</template-dashboard-layout>
