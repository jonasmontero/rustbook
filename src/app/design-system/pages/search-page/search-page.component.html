<!-- SearchPage - Resultados de Busca -->
<template-search-results-layout
  [showFilters]="showFilters"
  [searchValues]="searchValues"
  [loading]="loading"
  [userName]="userName"
  (searchSubmit)="onSearch($event)">

  <!-- Filtros -->
  <div filters class="page-search__filters">
    <!-- Companhias -->
    <div class="page-search__filter-group">
      <h4 class="page-search__filter-title">Companhias</h4>
      <label class="page-search__filter-checkbox">
        <input
          type="checkbox"
          [checked]="isAirlineSelected('azul')"
          (change)="onAirlineToggle('azul')"
        />
        <span>Azul</span>
      </label>
      <label class="page-search__filter-checkbox">
        <input
          type="checkbox"
          [checked]="isAirlineSelected('gol')"
          (change)="onAirlineToggle('gol')"
        />
        <span>Gol</span>
      </label>
      <label class="page-search__filter-checkbox">
        <input
          type="checkbox"
          [checked]="isAirlineSelected('latam')"
          (change)="onAirlineToggle('latam')"
        />
        <span>Latam</span>
      </label>
    </div>

    <!-- Preço -->
    <div class="page-search__filter-group">
      <h4 class="page-search__filter-title">Faixa de Preço</h4>
      <p class="page-search__filter-value">Até R$ {{ maxPrice }}</p>
      <input
        type="range"
        min="200"
        max="2000"
        step="50"
        [value]="maxPrice"
        (input)="onPriceChange($any($event.target).value)"
        class="page-search__filter-range"
      />
    </div>

    <!-- Paradas -->
    <div class="page-search__filter-group">
      <h4 class="page-search__filter-title">Paradas</h4>
      <label class="page-search__filter-checkbox">
        <input
          type="checkbox"
          [checked]="directOnly"
          (change)="onDirectOnlyToggle()"
        />
        <span>Apenas voos diretos</span>
      </label>
    </div>
  </div>

  <!-- Resultados -->
  <organism-flight-list
    [flights]="filteredFlights"
    [totalCount]="filteredFlights.length"
    [loading]="loading"
    [sortBy]="sortBy"
    [hasMore]="false"
    [selectedFlightId]="selectedFlightId"
    (sortChange)="onSortChange($any($event))"
    (flightSelect)="onFlightSelect($event)"
  />
</template-search-results-layout>
