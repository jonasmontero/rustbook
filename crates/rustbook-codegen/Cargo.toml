[package]
name = "rustbook-codegen"
version = "0.1.0"
edition = "2021"
authors = ["Jonas Monteiro"]
license = "MIT"
description = "Multi-target codegen for Rustbook design tokens (Web, iOS, Android, Flutter, Tailwind)."

[dependencies]
rustbook-core = { path = "../rustbook-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
